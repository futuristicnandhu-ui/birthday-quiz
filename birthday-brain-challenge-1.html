{i:"பேய் கேட்டது: 'யார் நீ?' கார்த்தி: 'ம்ம்...' 'எங்கிருந்து வந்தாய்?' 'ம்ம்...' பேய் குழம்பி, ஒரு நிமிடம் அதுவே பயந்துவிட்டது 😂",r:"கார்த்தி: 'ம்ம்...' என்று மட்டும் சொன்னார். அது 'நன்றி' என்று நமக்குப் புரிந்தது 😄"},
{i:"சங்கிலிக்குள் சிக்கியிருந்தும் வெக்டர் சுவரில் பேயின் படத்தை வரைந்துக்கொண்டிருந்தார்: 'முகம் கொஞ்சம் சரியா வரலை, ஒரு நிமிஷம் அப்படியே நில்லுங்க!' 🎨",r:"வெக்டர் தப்பித்ததும் பேய் கேட்டது: 'எனக்கும் ஒன்னு போட்டுக் கொடுப்பா!' 🖌️"},
{i:"குட்டிப் பேய் அழுதது. ஹினாட்டா மிகவும் பக்குவமாக: 'பயப்படாதே, உன் பிரச்சினை என்னன்னு பேசலாம்' என்று பேயிடம் கவுன்சிலிங் கொடுத்தார் 🧘",r:"ஹினாட்டா: 'நடந்ததை நினைத்து வருந்தாதீங்க, அடுத்து என்ன செய்யலாம்னு பார்க்கலாம்.' குட்டிப் பேய் தலையாட்டிக் கேட்டது 😌"},
{i:"வவ்வால்கள் சூழ்ந்தும் சாம்ப் அழகான தூய தமிழில் முழங்கினார்: 'வவ்வால்களே, அமைதி காப்பீர்!' வவ்வால்களுக்கே ஒன்றும் புரியவில்லை 😄 டோராவைக் கண்டதும் செல்லமாகத் திட்டத் தயாராக இருக்கிறார்: 'எங்கே போனாய் நீ, என்னிடம் சொல்லாமல்?!' 😤",r:"சாம்ப் மீட்கப்பட்டதும் முதல் வார்த்தை: 'எங்கே போனாய் நீ, என்னிடம் சொல்லாமல்?' பேய்களே பயந்துவிட்டன, ஏனெனில் அந்தத் திட்டு அவ்வளவு தூய தமிழில்! 😂"}
];
const intro=c=>({e:"👻",t:"அத்தியாயம் "+(c+1)+" • "+CH[c].f+" ஆபத்தில்!",b:CH[c].i+"\n\n"+J[c].i});
const rescue=c=>{const n=(c<5?ST[c+1]:50)-ST[c],g=cc*2>=n,f=CH[c].f;cc=0;return g?{e:"✅",t:f+" மீட்கப்பட்டார்!",b:f+" பத்திரமாக விடுவிக்கப்பட்டார்! உங்கள் அறிவைக் கண்டு பேய்களே வழிவிட்டன.\n\n"+J[c].r,k:"conf"}:{e:"😰",t:f+" மயிரிழையில் தப்பினார்!",b:f+" கடைசி நொடியில் தப்பினார், ஆனால் பயத்தில் நடுங்குகிறார். அடுத்து இன்னும் கவனமாக!\n\n"+J[c].r}};
const SUR=[
{e:"🎁",t:"ஒரு சிறிய வாழ்த்து",b:"உங்கள் உழைப்பும் முயற்சியும் ஒருநாள் உங்களை மிக உயரத்தில் நிறுத்தும். இந்த நாள் மகிழ்ச்சியால் நிறையட்டும்!"},
{e:"⭐",t:"போனஸ் புள்ளி!",b:"உங்களுக்காக ஒரு இலவச மதிப்பெண் சேர்க்கப்பட்டுள்ளது.",k:"bonus"},
{e:"🛟",t:"50:50 உதவி கிடைத்துள்ளது!",b:"ஒரு கேள்வியில் இரண்டு தவறான விடைகளை நீக்கலாம். சரியான நேரத்தில் பயன்படுத்துங்கள்.",k:"life"},
{e:"💡",t:"உங்களுக்காக ஒரு தகவல்",b:"தமிழ் உலகின் மிகப் பழமையான வாழும் மொழிகளில் ஒன்று. அதைப் படிப்பவர்கள் ஒரு பெரிய பாரம்பரியத்தின் வாரிசுகள்."},
{e:"🎉",t:"கொண்டாட்ட நேரம்!",b:"இன்று உங்கள் நாள். இந்தத் தருணத்தை ரசியுங்கள்!",k:"conf"},
{e:"🌟",t:"நம்பிக்கை வரிகள்",b:"கனவு காண்பது தொடக்கம்; தொடர்ந்து முயல்வதே வெற்றி. நீங்கள் அதைச் செய்வீர்கள் என்பதில் ஐயமில்லை."},
{e:"🍰",t:"இனிப்புக்கு இடைவேளை",b:"சிறிது மூச்சு விட்டுக்கொள்ளுங்கள். கேக் வெட்டும் முன் இன்னும் கேள்விகள் மீதமுள்ளன!",k:"conf"}
];
let Q,i,s,nm,ll,slots,cur,cc=0,queue=[],fin=false;
for(let n=0;n<9;n++){const g=document.createElement("span");g.className="gh";g.textContent=n%4===3?"🦇":"👻";g.style.left=(n*11+Math.random()*6)+"vw";g.style.fontSize=(22+Math.random()*22)+"px";g.style.animationDelay=(-n*1.6)+"s";g.style.animationDuration=(11+Math.random()*8)+"s";document.body.appendChild(g)}
const $=id=>document.getElementById(id);
const shuf=a=>{a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.random()*(j+1)|0;[a[j],a[k]]=[a[k],a[j]]}return a};
let AC,mut=false,drone;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,ty,v,at,sl){const a=au();if(!a||mut)return;const o=a.createOscillator(),g=a.createGain();o.type=ty||"sine";const t=a.currentTime+(at||0);o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||.15,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
const sfx={ok(){tone(660,.15,"sine",.2);tone(880,.25,"sine",.2,.12)},bad(){tone(180,.35,"sawtooth",.12,0,90)},scare(){tone(900,.9,"sawtooth",.1,0,120);tone(120,1.2,"square",.08,.1,60)},win(){[523,659,784,1047].forEach((f,k)=>tone(f,.3,"triangle",.2,k*.12))},bell(){tone(440,1.5,"sine",.2);tone(660,1.2,"sine",.1)},fan(){[523,523,587,523,698,659].forEach((f,k)=>tone(f,.35,"triangle",.22,k*.3))}};
function say(t){if(mut||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ta-IN";u.pitch=1.5;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function mute(){mut=!mut;$("mu").textContent=mut?"🔇":"🔊";if(mut&&window.speechSynthesis)speechSynthesis.cancel();if(drone)drone.g.gain.value=mut?0:.03}
let mood="spooky",bt,stp=0;
const SC={spooky:[220,233.1,277.2,329.6,349.2,415.3,440],scare:[110,116.5,138.6,164.8,174.6,207.7,220],happy:[262,294,330,349,392,440,494,523]};
const PAT=[0,2,4,2,5,4,2,0,1,3,5,3,6,5,3,1];
function startMusic(){if(bt)return;const lp=()=>{bt=setTimeout(()=>{if(!mut&&!document.hidden){const sc=SC[mood],n=PAT[stp%PAT.length];stp++;tone(sc[n%sc.length]*2,.9,"triangle",mood==="happy"?.1:.07);if(stp%8===0)tone(sc[0]/2,2.4,"sine",mood==="happy"?.05:.1)}lp()},mood==="happy"?380:mood==="scare"?330:640)};lp()}
function startDrone(){const a=au();if(!a||drone)return;const o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.value=55;g.gain.value=.03;o.connect(g);g.connect(a.destination);o.start();drone={o,g}}
function begin(){au();startDrone();startMusic();
  nm="டோரா";
  Q=D.map(d=>({c:d[0],q:d[1],a:d[2],o:d.slice(2,6),e:d[6]||""}));
  i=0;s=0;ll=0;
  const pos=shuf([...Array(44).keys()].map(n=>n+3)).slice(0,SUR.length).sort((a,b)=>a-b);
  const su=shuf(SUR);slots={};pos.forEach((p,n)=>slots[p]=su[n]);
  $("start").classList.add("hide");queue=[PRO,intro(0)];play();
}
function show(){
  const x=Q[i];cur=x;$("cnt").textContent="கேள்வி "+(i+1)+" / "+Q.length;$("sc").textContent="⭐ "+s;
  $("pb").style.width=(i/Q.length*100)+"%";const ch=ST.filter(n=>n<=i).length-1;$("cat").textContent=x.c+" • 🔦 "+CH[ch].f+" காப்பாற்ற";$("q").textContent=x.q;
  $("exp").classList.add("hide");$("next").classList.add("hide");
  $("opts").innerHTML="";
  shuf(x.o).forEach(t=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>pick(b,t);$("opts").appendChild(b)});
  llBtn();
}
function llBtn(){const b=$("ll");b.textContent="🛟 50:50 ("+ll+")";b.classList.toggle("hide",ll<1||$("opts").children[0].disabled)}
function fifty(){
  let w=[...$("opts").children].filter(b=>b.textContent!==cur.a&&!b.disabled);
  shuf(w).slice(0,2).forEach(b=>{b.disabled=true;b.style.opacity=.3});ll--;llBtn();
}
function pick(b,t){
  const bs=[...$("opts").children];
  bs.forEach(o=>{o.disabled=true;if(o.textContent===cur.a)o.classList.add("ok")});
  if(t===cur.a){s++;cc++;sfx.ok()}else{b.classList.add("bad");sfx.bad()}
  $("sc").textContent="⭐ "+s;$("ll").classList.add("hide");
  if(cur.e){$("exp").textContent="💡 "+cur.e;$("exp").classList.remove("hide")}
  $("next").textContent=i===Q.length-1?"முடிவைப் பார்க்க 🎁":"அடுத்தது ➜";$("next").classList.remove("hide");
}
function next(){
  if(i===Q.length-1){fin=true;queue=[rescue(5),FIN];play();return}
  const u=slots[i];i++;queue=u?[u]:[];if(ST.includes(i)){queue.push(rescue(ST.indexOf(i)-1),intro(ST.indexOf(i)))}play();return;
  if(u){surprise(u)}else show();
}
function surprise(u){mood=u.e==="👻"?"scare":u.e==="🎂"?"happy":"spooky";if(u.e==="🎂"&&drone)drone.g.gain.value=0;if(u.e==="👻"){sfx.scare();say("டோரா! காப்பாற்றுங்கள்!")}else if(u.e.startsWith("🕯"))sfx.bell();else if(u.e==="✅")sfx.win();else if(u.e==="😰")sfx.bad();else if(u.e==="🎂"){sfx.fan();say("இனிய பிறந்தநாள் வாழ்த்துகள் டோரா!")}else sfx.win();
  if(u.k==="bonus")s++;if(u.k==="life")ll++;
  $("quiz").classList.add("hide");$("sur").classList.remove("hide");
  $("se").textContent=u.e;$("st").textContent=u.t;$("sb").textContent=u.b;
  if(u.k==="conf")confetti();
}
function resume(){play()}
function play(){if(queue.length){surprise(queue.shift())}else if(fin){finish()}else{$("sur").classList.add("hide");$("quiz").classList.remove("hide");show()}}
function confetti(){
  for(let n=0;n<28;n++){const c=document.createElement("span");c.className="cf";c.textContent=["👻","🎉","🦇","✨"][n%4];
  c.style.left=Math.random()*95+"vw";c.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),3600)}
}
function finish(){$("sur").classList.add("hide");
  $("quiz").classList.add("hide");$("end").classList.remove("hide");
  let e,t;
  if(s>=42){e="👑";t="அபாரம்! மிகச் சிறந்த அறிவு!"}else if(s>=32){e="🏆";t="மிகச் சிறப்பு! வாழ்த்துகள்!"}else if(s>=22){e="💪";t="நல்ல முயற்சி! தொடர்ந்து முன்னேறுங்கள்!"}else{e="📚";t="நல்ல தொடக்கம்! உங்களால் இன்னும் முடியும்!"}
  $("emoji").textContent=e;$("title").textContent=t;$("score").textContent=s+" / "+Q.length;
  $("wish").textContent="இனிய பிறந்தநாள் நல்வாழ்த்துகள், "+nm+"! 🎂 நீங்கள் இன்று ஆறு நண்பர்களையும் காப்பாற்றிவிட்டீர்கள்! உங்கள் கனவுகள் அனைத்தும் நிறைவேறி, வாழ்வில் வெற்றியும் மகிழ்ச்சியும் பெருகட்டும்.\n\n— அகல்யா, கனிப்ரோ, கார்த்தி, வெக்டர், ஹினாட்டா, சாம்ப் ❤️";
  confetti();
}
</script>
